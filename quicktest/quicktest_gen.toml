# ==========================================================
# QuickMachine **生成面**（纪律：与业务面分文件，同 pbtgen 双面体例）
# 管：生成什么 / 生成到哪 / 怎么接线 —— [meta] [generator] [type_mapping]
#     [artifacts] [defaults] [actions]
# 业务面见同目录 quicktest.toml（[business] [random_check] [[assert_check]]
#     [environment] [failure_detection] [report]）
#
# 引擎接线：skelgen_package = moongard 真面目（issue/refresh/MemRefreshStore
#     全在公面）——P0（system.mbt）调真旋转核过账执行，不重写换发语义
#     （jsonld 0.1.3 / mooncmd 0.2.2 / moonxml 0.3.2 同款口径）。
# ==========================================================
[meta]
name = "moongard_family_conservation"
version = "0.1.0"
description = "moongard 会话族守恒 QuickMachine 测试骨架生成配置"
prefix = "Mg"

[generator]
enabled = true
fsm_toml = "moongard/quicktest/quicktest_fsm.toml"
skelgen_package = "thy1016/moongard"
engine_alias = "@moongard"
qcs_alias = "@qcs"
output_dir = "moongard/quicktest"
# 生成头时间戳钉住（G6 口径：再生幂等）
generated_at = 1793500000000

[type_mapping]
span_alias = "RefId"
ref_type = "@qcs.Ref[RefId]"
# v1 无载荷机：无 Span 槽（模型槽白名单只认 Span 型 context 字段；
# 族台账镜像走 P0 手扩 Model.jti 链字段，非生成器槽型）
model_slots = []
# 守恒机不发射载荷——Effect 归一化留空表
effect_maps = {}
# 归一化码面：0 = 未定义转移（生成器 fallback 臂）；1 = 守恒律违（四律任一破）；
# 2 = 旋转核故障（refresh 非 Err 可解释形，语义漂移）；3 = 执行期引用未解
error_codes = { undefined_transition = 0, conservation_violation = 1, conversion_failed = 2, unbound_reference = 3 }

[artifacts]
types = true
valid = true
model_exec = true
callbacks = false
business = true
metrics = false
system = true
state_machine = true
runner = true
assembly = "direct"

[defaults]
precondition = "valid_table"
postcondition = "model_compare"
invariant = "top"
generator = "valid_weighted"
shrinker = "none"
mock = "model_execute"
response_vars = "none"
reify_command = "resolve_symbolic"
bind_response = "passthrough"
remap_command = "identity"

# ==========================================================
# [actions]：action → 意图表（生成面数据）
# 四个 action 都是"账本操作 + 扫账四验"（无发射载荷）→ Continue；
# 违律/核故障走 error_codes 的 Error(Int)。
# ==========================================================
[actions]
do_seed = "Continue"
do_rotate = "Continue"
do_replay = "Continue"
do_forge_alive = "Continue"
do_forge_dead = "Continue"
